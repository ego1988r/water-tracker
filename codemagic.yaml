workflows:
  android-workflow:
    name: Build APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Install Flet
        script: |
          pip3 install flet==1.0.1
      - name: Accept Android licenses
        script: |
          yes "y" | head -n 100 | flutter doctor --android-licenses || true
      - name: Build APK
        script: |
          flet build apk
    artifacts:
      - build/**/outputs/**/*.apk
      - build/app/outputs/**/*.apk
